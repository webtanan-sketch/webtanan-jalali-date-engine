<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Webtanan Jalali Date Engine architecture</title><desc id="desc">Architecture diagram connecting frameworks, Jalali core, enterprise modules and storage repositories.</desc>
<defs><linearGradient id="core" x1="0" x2="1"><stop stop-color="#17365d"/><stop offset="1" stop-color="#155eef"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="720" rx="28" fill="#f8fafc"/>
<text x="720" y="60" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="32" font-weight="800" fill="#172033">معماری Webtanan Jalali Date Engine v1.0</text>
<text x="720" y="92" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#667085">یک هسته مشترک؛ چند رابط کاربری؛ چند Storage قابل انتخاب</text>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Accounting — Webtanan Jalali</title><link rel="stylesheet" href="../dist/browser/webtanan-jalali.css"><link rel="stylesheet" href="./shared.css"></head><body><main class="demo-shell"><header class="demo-header"><div><h1>دموی تقویم حسابداری</h1><p>ثبت سررسید و دریافت، جمع مبالغ باز و محاسبه روز کاری با تعطیلات رسمی ۱۴۰۵.</p></div><span class="badge">Steel Neutral</span></header><div class="grid"><section class="panel"><h2>تاریخ حسابداری</h2><div id="calendar" class="calendar-host"></div></section><section class="panel"><div class="summary"><div class="metric"><span>مجموع سررسید باز</span><b id="pendingSum">۰</b></div><div class="metric"><span>روز کاری بعدی</span><b id="nextBusiness">—</b></div><div class="metric"><span>سررسیدهای باز</span><b id="pendingCount">۰</b></div></div><h2>ثبت رویداد مالی</h2><div class="form-grid"><label>نوع<select id="type"><option value="payment-due">سررسید پرداخت</option><option value="payment-received">دریافت</option><option value="invoice">فاکتور</option><option value="payroll">حقوق</option><option value="tax">مالیات</option><option value="period-closing">بستن دوره</option></select></label><label>مبلغ<input id="amount" type="number" value="25000000"></label><label>عنوان<input id="title" value="سررسید پرداخت مشتری"></label><label>مرجع<input id="reference" value="INV-1001"></label><label>کاربر<input id="user" value="حسابدار"></label><label>وضعیت<select id="status"><option value="pending">باز</option><option value="done">انجام شده</option><option value="cancelled">لغو</option></select></label></div><div class="actions"><button id="add">ثبت</button><button id="business" class="secondary">محاسبه روز کاری بعدی</button></div><pre id="log" class="log">[]</pre></section></div></main><script src="../dist/browser/webtanan-jalali.js"></script><script>const W=window.WebtananJalali;const accounting=new W.AccountingCalendarAdapter();const holidays=new W.HolidayEngine();const dataset=W.getIranOfficialHolidayDataset(1405);if(dataset)holidays.load(dataset,1405);const business=new W.BusinessDayCalculator({holidays});const picker=new W.WebtananDatePicker({theme:'steel-neutral',holidays:true});picker.setHolidayEngine(holidays);picker.setDate('1405/06/11');picker.open('#calendar');let seq=0;const render=()=>{const pending=accounting.getPendingDues();document.querySelector('#pendingCount').textContent=W.PersianDigits.toPersian(pending.length);document.querySelector('#pendingSum').textContent=W.PersianDigits.toPersian(accounting.sum('payment-due','pending').toLocaleString('en-US'));document.querySelector('#log').textContent=JSON.stringify(accounting.list(),null,2)};document.querySelector('#add').onclick=()=>{try{accounting.add({id:'ACC-'+(++seq),date:picker.getDate()||'1405/06/11',title:document.querySelector('#title').value,type:document.querySelector('#type').value,status:document.querySelector('#status').value,amount:Number(document.querySelector('#amount').value||0),reference:document.querySelector('#reference').value,user:document.querySelector('#user').value});render()}catch(error){alert(error.message)}};document.querySelector('#business').onclick=()=>{try{document.querySelector('#nextBusiness').textContent=business.nextBusinessDay(picker.getDate()||'1405/06/11')}catch(error){alert(error.message)}};render();</script></body></html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دموی Webtanan Jalali Date Engine</title>
  <link rel="stylesheet" href="../src/ui/webtanan-jalali.css">
  <style>
    body{margin:0;background:#f3f5f7;font-family:Tahoma,Arial,sans-serif;color:#172033}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .demo-card{width:min(100%,520px)}
    h1{font-size:20px;margin:0 0 8px}.hint{font-size:13px;color:#667085;margin:0 0 18px}
  </style>
</head>
<body>
  <main>
    <section class="demo-card">
      <h1>موتور تاریخ شمسی وب‌تنان</h1>
      <p class="hint">نمونه رابط صنعتی RTL — نسخه 0.5.0</p>
      <div class="webtanan-calendar">
        <header class="webtanan-calendar__header">
          <button class="webtanan-calendar__nav" type="button" aria-label="ماه قبل">‹</button>
          <strong class="webtanan-calendar__title">شهریور ۱۴۰۵</strong>
          <button class="webtanan-calendar__nav" type="button" aria-label="ماه بعد">›</button>
        </header>
        <div class="webtanan-calendar__weekdays">
          <span>شنبه</span><span>یکشنبه</span><span>دوشنبه</span><span>سه‌شنبه</span><span>چهارشنبه</span><span>پنجشنبه</span><span>جمعه</span>
        </div>
        <div class="webtanan-calendar__days" aria-label="روزهای ماه"></div>
      </div>
    </section>
  </main>
</body>
</html>

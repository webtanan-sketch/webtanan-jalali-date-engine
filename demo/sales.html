<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Sales — Webtanan Jalali</title><link rel="stylesheet" href="../dist/browser/webtanan-jalali.css"><link rel="stylesheet" href="./shared.css"></head><body><main class="demo-shell"><header class="demo-header"><div><h1>دموی گردش فروش</h1><p>ثبت مرحله سفارش، محاسبه درصد پیشرفت، تشخیص مرحله جاری و کنترل تأخیر با تاریخ شمسی.</p></div><span class="badge">Industrial Light</span></header><div class="grid"><section class="panel"><h2>انتخاب تاریخ مرحله</h2><div id="calendar" class="calendar-host"></div></section><section class="panel"><div class="summary"><div class="metric"><span>پیشرفت</span><b id="progress">۰٪</b></div><div class="metric"><span>مرحله جاری</span><b id="current">—</b></div><div class="metric"><span>تأخیر</span><b id="delay">خیر</b></div></div><h2>افزودن مرحله</h2><div class="form-grid"><label>مرحله<select id="stage"><option value="order">ثبت سفارش</option><option value="approval">تأیید</option><option value="production">تولید</option><option value="loading">بارگیری</option><option value="delivery">تحویل</option></select></label><label>وضعیت<select id="status"><option value="done">انجام شده</option><option value="active">فعال</option><option value="pending">در انتظار</option><option value="failed">ناموفق</option></select></label><label>مسئول<input id="responsible" value="مدیر فروش"></label><label>موعد تحویل<input id="due" value="1405/06/20"></label><label class="wide">یادداشت<input id="note" value="مرحله سفارش مشتری"></label></div><div class="actions"><button id="add">افزودن مرحله</button><button id="check" class="secondary">بررسی تأخیر در ۱۴۰۵/۰۶/۲۱</button></div><pre id="log" class="log">[]</pre></section></div></main><script src="../dist/browser/webtanan-jalali.js"></script><script>const W=window.WebtananJalali;const sales=new W.SalesWorkflowAdapter();const picker=new W.WebtananDatePicker({theme:'industrial-light'});picker.setDate('1405/06/01');picker.open('#calendar');const labels={order:'ثبت سفارش',approval:'تأیید',production:'تولید',loading:'بارگیری',delivery:'تحویل'};const render=()=>{document.querySelector('#progress').textContent=W.PersianDigits.toPersian(sales.getProgress())+'٪';const current=sales.getCurrentStage();document.querySelector('#current').textContent=current?labels[current.stage]:'—';document.querySelector('#log').textContent=JSON.stringify(sales.toJSON(),null,2)};document.querySelector('#add').onclick=()=>{try{sales.addStep({stage:document.querySelector('#stage').value,date:picker.getDate()||'1405/06/01',status:document.querySelector('#status').value,responsible:document.querySelector('#responsible').value,note:document.querySelector('#note').value});render()}catch(error){alert(error.message)}};document.querySelector('#check').onclick=()=>{try{document.querySelector('#delay').textContent=sales.isDelayed(document.querySelector('#due').value,'1405/06/21')?'بله':'خیر'}catch(error){alert(error.message)}};render();</script></body></html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Production — Webtanan Jalali</title><link rel="stylesheet" href="../dist/browser/webtanan-jalali.css"><link rel="stylesheet" href="./shared.css"></head><body><main class="demo-shell"><header class="demo-header"><div><h1>دموی برنامه‌ریزی و گردش تولید</h1><p>ساخت سفارش تولید، ثبت تاریخ مراحل، مسئول هر مرحله، درصد پیشرفت و کنترل تأخیر.</p></div><span class="badge">Graphite Dark</span></header><div class="grid"><section class="panel"><h2>تاریخ مرحله تولید</h2><div id="calendar" class="calendar-host"></div></section><section class="panel"><div class="summary"><div class="metric"><span>پیشرفت تولید</span><b id="progress">۰٪</b></div><div class="metric"><span>مرحله جاری</span><b id="current">—</b></div><div class="metric"><span>وضعیت موعد</span><b id="delay">عادی</b></div></div><h2>سفارش تولید</h2><div class="form-grid"><label>شناسه سفارش<input id="orderId" value="P-100"></label><label>محصول<input id="product" value="کاشی استخری"></label><label>تعداد<input id="quantity" type="number" value="120"></label><label>موعد تحویل<input id="due" value="1405/06/20"></label><label>مرحله<select id="stage"><option value="planning">برنامه‌ریزی</option><option value="materials">تأمین مواد</option><option value="production">تولید</option><option value="quality">کنترل کیفیت</option><option value="packing">بسته‌بندی</option><option value="loading">بارگیری</option><option value="delivery">تحویل</option></select></label><label>وضعیت<select id="status"><option value="done">انجام شده</option><option value="active">فعال</option><option value="pending">در انتظار</option><option value="failed">ناموفق</option></select></label><label class="wide">مسئول<input id="responsible" value="سرپرست تولید"></label></div><div class="actions"><button id="create">ساخت سفارش</button><button id="update" class="secondary">ثبت/ویرایش مرحله</button><button id="check" class="secondary">بررسی تأخیر در ۱۴۰۵/۰۶/۲۱</button></div><pre id="log" class="log">{}</pre></section></div></main><script src="../dist/browser/webtanan-jalali.js"></script><script>const W=window.WebtananJalali;const production=new W.ProductionWorkflowAdapter();const picker=new W.WebtananDatePicker({theme:'graphite-dark'});picker.setDate('1405/06/01');picker.open('#calendar');const stageNames={planning:'برنامه‌ریزی',materials:'تأمین مواد',production:'تولید',quality:'کنترل کیفیت',packing:'بسته‌بندی',loading:'بارگیری',delivery:'تحویل'};const id=()=>document.querySelector('#orderId').value;const render=()=>{try{const order=production.getOrder(id());document.querySelector('#progress').textContent=W.PersianDigits.toPersian(production.getProgress(id()))+'٪';const current=production.getCurrentStage(id());document.querySelector('#current').textContent=current?stageNames[current.key]:'تمام شده';document.querySelector('#log').textContent=JSON.stringify(order,null,2)}catch{document.querySelector('#log').textContent='{}'}};document.querySelector('#create').onclick=()=>{try{production.createOrder({id:id(),product:document.querySelector('#product').value,quantity:Number(document.querySelector('#quantity').value),startDate:picker.getDate()||'1405/06/01',dueDate:document.querySelector('#due').value});render()}catch(error){alert(error.message)}};document.querySelector('#update').onclick=()=>{try{production.updateStage(id(),document.querySelector('#stage').value,{status:document.querySelector('#status').value,date:picker.getDate()||'1405/06/01',responsible:document.querySelector('#responsible').value});render()}catch(error){alert(error.message)}};document.querySelector('#check').onclick=()=>{try{document.querySelector('#delay').textContent=production.isDelayed(id(),'1405/06/21')?'با تأخیر':'عادی'}catch(error){alert(error.message)}};render();</script></body></html>
